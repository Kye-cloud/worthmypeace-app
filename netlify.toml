[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'No build step needed'"

# Keep server code and config files from being served as web pages
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
